services:
  zero:
    image: dgraph/dgraph:v25.5.1
    container_name: dgraph-zero
    command: dgraph zero --my=zero:5080
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph_zero:/dgraph
    restart: unless-stopped

  alpha:
    image: dgraph/dgraph:v25.5.1
    container_name: dgraph-alpha
    command: >-
      dgraph alpha
      --my=alpha:7080
      --zero=zero:5080
      --security whitelist=10.0.0.0/8,172.0.0.0/8,192.168.0.0/16,127.0.0.1
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph_alpha:/dgraph
    depends_on:
      - zero
    restart: unless-stopped

  ratel:
    image: dgraph/ratel:v25.3.0
    container_name: dgraph-ratel
    ports:
      - "8000:8000"
    depends_on:
      - alpha
    restart: unless-stopped

volumes:
  dgraph_zero:
  dgraph_alpha:
