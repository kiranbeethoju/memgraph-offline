services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph-mage
    ports:
      - "7687:7687" # Bolt protocol (Cypher queries / drivers)
      - "7444:7444" # WebSocket / log streaming
    volumes:
      - mg_lib:/var/lib/memgraph
    restart: unless-stopped

  # Lab opens Bolt from inside this container, then serves the UI on port 3000.
  # Host networking makes 127.0.0.1:7687 the Memgraph port published on the Linux host,
  # and lets Lab reach any other Bolt address that host can reach.
  lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    network_mode: host
    depends_on:
      - memgraph
    environment:
      QUICK_CONNECT_MG_HOST: 127.0.0.1
      QUICK_CONNECT_MG_PORT: "7687"
      QUICK_CONNECT_MG_IS_ENCRYPTED: "false"
      LOGIN_RESERVED_HOSTNAME_IS_ENABLED: "true"
    restart: unless-stopped

volumes:
  mg_lib:
